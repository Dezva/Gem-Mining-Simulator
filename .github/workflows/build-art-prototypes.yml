name: Build 3D pickaxe prototypes
on:
  push:
    branches:
      - art/picos-3d-prototipos-v1
    paths:
      - art/pickaxes/prototypes-v1/generar_modelos.py
      - .github/workflows/build-art-prototypes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model generation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5' 'shapely>=2,<3'
      - name: Generate actual GLB models and manifest
        run: python art/pickaxes/prototypes-v1/generar_modelos.py
      - name: Package the four GLBs
        working-directory: art/pickaxes/prototypes-v1
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = sorted(Path('.').glob('pick_*_concept_v1.glb'))
          assert len(files) == 4
          with ZipFile('GemMining_Picos_3D_Solo_Modelos.zip', 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for file in files: z.write(file, file.name)
          print('Generated:', [f.name for f in files])
          PY
      - name: Commit generated binary assets to art branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/pickaxes/prototypes-v1/*.glb art/pickaxes/prototypes-v1/modelo_manifest.json art/pickaxes/prototypes-v1/GemMining_Picos_3D_Solo_Modelos.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build four pickaxe GLBs and ZIP"
            git push
          fi
